<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light" />
	<meta name="theme-color" content="#f6f4eb" />
	<title>Kamu sedang offline — Ringkas</title>
	<style>
		:root { color-scheme: only light; }
		* { box-sizing: border-box; }
		body {
			display: grid;
			min-height: 100dvh;
			place-items: center;
			margin: 0;
			padding: 1rem;
			background: #f6f4eb;
			color: #fdfbf4;
			font-family: system-ui, sans-serif;
		}
		main {
			width: min(100%, 35rem);
			padding: clamp(1.4rem, 6vw, 3.6rem);
			border-radius: 1.15rem;
			background: #143c31;
		}
		h1 {
			margin: 0.75rem 0;
			font: 400 clamp(2.25rem, 7vw, 4rem)/1 Georgia, serif;
			letter-spacing: -0.045em;
		}
		p { color: #e0eadb; line-height: 1.6; }
		nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem 1rem; margin-top: 1.4rem; }
		a { color: #fdfbf4; text-underline-offset: 0.25em; }
		button { min-height: 2.75rem; padding: 0.65rem 1rem; border: 0; border-radius: 0.55rem; background: #e9f492; color: #203129; font: inherit; font-weight: 700; cursor: pointer; }
		:focus-visible { outline: 2px solid #e9f492; outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<img src="/logo/logo-ringkas-icon-emerald.svg" alt="Ringkas" width="43" height="41" />
		<h1>Kamu sedang offline.</h1>
		<p>Halaman ini belum tersimpan di perangkatmu. Sambungkan kembali ke internet untuk membukanya.</p>
		<nav aria-label="Pilihan saat offline">
			<button type="button" onclick="location.reload()">Coba lagi</button>
			<a href="/">Kembali ke beranda</a>
		</nav>
	</main>
</body>
</html>
