<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#177245" />
		<title>Kamu sedang offline — Ringkas</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: #f7f5ef;
				color: #22302a;
				font-family:
					"Noto Sans",
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			.card {
				width: 100%;
				max-width: 420px;
				text-align: center;
				background: #fff;
				border: 1px solid #e7e2d2;
				border-radius: 20px;
				padding: 32px 24px;
			}
			img {
				width: 72px;
				height: 72px;
			}
			h1 {
				margin: 16px 0 8px;
				font-size: 22px;
				line-height: 1.3;
				color: #177245;
			}
			p {
				margin: 0 0 8px;
				font-size: 15px;
				line-height: 1.6;
				color: #3f4a42;
			}
			.note {
				font-size: 13px;
				color: #5f6b62;
			}
			.btn {
				display: inline-block;
				margin-top: 16px;
				padding: 12px 22px;
				border-radius: 999px;
				background: #177245;
				color: #fff;
				font-weight: 700;
				font-size: 15px;
				text-decoration: none;
				border: 0;
				cursor: pointer;
			}
			.link {
				display: block;
				margin-top: 12px;
				color: #177245;
				font-weight: 700;
				font-size: 14px;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<img src="/logo/logo-ringkas-icon-emerald.svg" alt="Ringkas" />
			<h1>Kamu sedang offline</h1>
			<p>Materi yang sudah dibuka tetap bisa dibaca. Halaman ini belum pernah dibuka, jadi belum tersimpan di perangkatmu.</p>
			<p class="note">
				Catatan: Ringkas belum bisa dipakai sepenuhnya tanpa internet — materi yang belum pernah dibuka
				tidak tersedia offline.
			</p>
			<button class="btn" type="button" onclick="location.reload()">Coba Lagi</button>
			<a class="link" href="/">Kembali ke Beranda</a>
		</main>
	</body>
</html>
