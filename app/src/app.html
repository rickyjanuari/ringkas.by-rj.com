<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/logo/logo-ringkas-icon-emerald.svg" />
		<link rel="apple-touch-icon" href="/logo/favicon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#f6f4eb" />
		<title>Ringkas — Rangkuman & Latihan SD dan MI</title>
		<meta
			name="description"
			content="Rangkuman per bab, kuis, dan paket latihan SAS untuk kelas 1–6 SD dan MI."
		/>
		<link rel="stylesheet" href="/fonts/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- PWA: daftarkan service worker bila didukung. Gagal daftar
		     (mis. konteks bukan HTTPS) bukan error fatal — situs tetap
		     jalan sebagai web biasa. -->
		<script>
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker.register("/sw.js").catch(function () {});
				});
			}
		</script>
	</body>
</html>
