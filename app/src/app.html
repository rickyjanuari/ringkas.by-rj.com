<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/logo/logo-ringkas-icon-emerald.svg" />
		<link rel="apple-touch-icon" href="/logo/favicon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#177245" />
		<title>Ringkas — Rangkuman Materi SD, SMP, SMA</title>
		<meta
			name="description"
			content="Rangkuman materi SD, SMP, SMA — teman belajar yang ringkas dan menyenangkan."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- PWA: daftarkan service worker bila didukung. Gagal daftar
		     (mis. konteks bukan HTTPS) bukan error fatal — situs tetap
		     jalan sebagai web biasa. -->
		<script>
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function () {
					navigator.serviceWorker.register("/sw.js").catch(function () {});
				});
			}
		</script>
	</body>
</html>
