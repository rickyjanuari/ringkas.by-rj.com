# wrangler.toml — konfigurasi deploy Cloudflare untuk Ringkas.
#
# Arsitektur (satu Worker, satu domain — lihat README bagian
# "Deploy ke Cloudflare" untuk alasan pemilihannya):
#   - Worker ini melayani API Hono (/api/*) dari server/worker.ts
#     dengan database D1 (binding DB).
#   - Aset statis SvelteKit (hasil `npm run build` → build/) disajikan
#     di domain yang sama lewat [assets]; rute SPA yang tidak cocok
#     dengan berkas apa pun jatuh ke index.html (single-page-application).
#
# YANG HARUS DIISI PEMILIK (sebelum deploy pertama):
#   - database_id di bawah: jalankan `wrangler d1 create ringkas-db`,
#     lalu ganti nilai dummy 00000000-... dengan database_id dari output.
#   - secrets (JANGAN tulis nilainya di sini!): jalankan
#       wrangler secret put SESSION_SECRET
#       wrangler secret put KLIKQRIS_API_KEY
#       wrangler secret put KLIKQRIS_MERCHANT_ID
#       wrangler secret put KLIKQRIS_WEBHOOK_SECRET
#       wrangler secret put RESEND_API_KEY
#     (RESEND_FROM bukan secret — ada di [vars] bawah.)
#
# Perintah terkait:
#   wrangler d1 migrations apply ringkas-db --remote   (sebelum deploy)
#   npm run build && wrangler deploy                   (atau: npm run deploy)

name = "ringkas"
main = "server/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker JALAN DULU untuk semua request (termasuk aset statis): tanpa ini,
# request yang cocok dengan aset statis disajikan langsung oleh lapisan
# aset TANPA melewati Worker — header keamanan di server/worker.ts
# (CSP, X-Frame-Options, dll.) tidak akan pernah menempel di /, /shorts/*,
# atau berkas JS/CSS. Dengan run_worker_first, Worker memanggil
# env.ASSETS.fetch() lalu membungkus respons dengan header keamanan.
# Trade-off: tiap request aset melewati Worker (latensi sedikit naik) —
# itu harga yang wajar demi header keamanan di semua respons.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ringkas-db"
database_id = "ed69abc1-16eb-464f-91bf-848feecc40b8" # D1 ringkas-db, dibuat 2026-11-15 (terverifikasi via API Cloudflare)
migrations_dir = "server/migrations"

[vars]
# Bukan secret — alamat pengirim email (sudah publik).
RESEND_FROM = "halo@ringkas.by-rj.com"
# Bukan secret — URL dasar situs, dipakai untuk tautan di email otomatis.
APP_URL = "https://ringkas.by-rj.com"
# API payment pusat; key aplikasinya disimpan sebagai secret PAYMENT_API_KEY.
PAYMENT_API_URL = "https://api.by-rj.com"
# Bukan secret (site key publik) — diisi pemilik dari dashboard Cloudflare
# Turnstile. Bila kosong, widget Turnstile tidak tampil dan verifikasi
# dilewati (lihat src/routes/akun/+page.svelte). Secret pasangannya
# (TURNSTILE_SECRET_KEY) JANGAN ditulis di sini — pakai `wrangler secret put`.
TURNSTILE_SITE_KEY = ""

# Cron email (scheduled handler di server/worker.ts):
#   "0 0 * * *"  → tiap hari 00:00 UTC (07:00 WIB): pengingat belajar
#                  (anak 3 hari tidak belajar) + ucapan milestone streak.
#   "0 11 * * SUN" → tiap Minggu 11:00 UTC (18:00 WIB): laporan mingguan
#                  orang tua. Tanpa RESEND_API_KEY, cron jalan tapi email
#                  dilewati + dicatat di log.
[triggers]
crons = ["0 0 * * *", "0 11 * * SUN", "*/15 * * * *"]
